<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>$honchoy · Savings & money planning for women</title>
  <meta name="description" content="$honchoy (সঞ্চয়) helps women plan budgets, manage debt, build an emergency fund and reach savings goals, in English and Bangla." />
  <meta name="theme-color" content="#e84f82" />
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" rel="stylesheet" />
  <!-- Design system: tokens → components → app shell -->
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <header class="app-header">
    <div class="container app-header__inner">
      <a href="#/home" class="logo" aria-label="$honchoy home">
        <img src="/img/logo.svg" alt="" width="36" height="36" />
        <span class="logo__word"><b>$</b>honchoy</span>
      </a>
      <nav class="top-nav" id="top-nav" aria-label="Main"></nav>
      <div class="header-actions">
        <div id="lang-slot"></div>
        <a href="#/settings" class="icon-btn settings-link" data-i18n-aria="nav.settings"><i class="fa-solid fa-gear"></i></a>
      </div>
    </div>
  </header>

  <!-- Each screen renders into #app (see js/app.js → ROUTES) -->
  <main id="app" tabindex="-1"></main>

  <footer class="app-footer" data-i18n="set.privacy"></footer>
  <nav class="bottom-nav" id="bottom-nav" aria-label="Main"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
